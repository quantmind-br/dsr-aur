# Overrides for the containerized repository builder.

# Target the Zen 5 desktop. Stay at x86-64-v3: the ARM64 host emulates x86_64
# with QEMU, which cannot execute AVX-512, and builds run their own binaries.
CFLAGS=${CFLAGS/-march=x86-64 -mtune=generic/-march=x86-64-v3 -mtune=znver5}
CXXFLAGS=${CXXFLAGS/-march=x86-64 -mtune=generic/-march=x86-64-v3 -mtune=znver5}
RUSTFLAGS+=" -C target-cpu=x86-64-v3"
export GOAMD64=v3

MAKEFLAGS="-j$(nproc)"
# autodeps records the library sonames a package provides and links against (as Arch's own
# builds do), which pacman checks on install and the builder uses to detect ABI breaks.
OPTIONS+=(!debug autodeps)
BUILDENV+=(ccache)
