services:
  # Emulated fallback builder: GitHub Actions builds natively (.github/workflows/build.yml).
  # Start it with COMPOSE_PROFILES=vps-builder. Holds no signing key and no token.
  builder:
    profiles: ["vps-builder"]
    # Arch Linux images are x86_64 only; ARM hosts run them through qemu-user-static.
    platform: linux/amd64
    build:
      context: .
      dockerfile: builder/Dockerfile
    image: dsr-aur-builder:local
    command: ["dsr-build", "loop"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      REPO_NAME: dsr-aur
      BUILD_INTERVAL: ${BUILD_INTERVAL:-6h}
      BUILD_TIMEOUT: ${BUILD_TIMEOUT:-8h}
      STEP_TIMEOUT: ${STEP_TIMEOUT:-1h}
      MIN_FREE_GB: ${MIN_FREE_GB:-5}
      HOME_CACHE_MAX_GB: ${HOME_CACHE_MAX_GB:-5}
      ABI_CHECK_HOURS: ${ABI_CHECK_HOURS:-24}
      PACKAGER: ${PACKAGER:-quantmind-br <dsrodrigues20@gmail.com>}
      ALLOW_UNPINNED_AUR: ${ALLOW_UNPINNED_AUR:-0}
    cpus: ${BUILDER_CPUS:-1.5}
    mem_limit: ${BUILDER_MEMORY:-6g}
    volumes:
      - repo:/srv/repo:ro
      - exchange:/srv/exchange
      - control:/srv/control:ro
      - cache:/var/cache/dsr-aur

  # Validates, signs and publishes what the builder hands over; never runs PKGBUILD code.
  publisher:
    platform: linux/amd64
    build:
      context: .
      dockerfile: builder/Dockerfile
    image: dsr-aur-builder:local
    command: ["dsr-publish", "loop"]
    restart: unless-stopped
    init: true
    stop_grace_period: 2m
    environment:
      REPO_NAME: dsr-aur
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SIGN_KEY_FPR: ${SIGN_KEY_FPR:-}
      CI_REPO: ${CI_REPO:-quantmind-br/dsr-aur}
      DELETE_GRACE_HOURS: ${DELETE_GRACE_HOURS:-24}
      NOTIFY_URL: ${NOTIFY_URL:-}
      STALE_HOURS: ${STALE_HOURS:-12}
      MIN_FREE_GB: ${MIN_FREE_GB:-5}
    volumes:
      - repo:/srv/repo
      - exchange:/srv/exchange
      - control:/srv/control
      - signing:/var/lib/dsr-aur

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    command: caddy file-server --root /srv/repo --listen :80 --browse
    volumes:
      - repo:/srv/repo:ro

volumes:
  repo:
  exchange:
  control:
  signing:
  cache:
